<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<img id="LOGO" src="config/logo.png"><img id="VF"><img id="PRS">
<script>
const C=document.getElementById('cv'),X=C.getContext('2d');
const LOGO=document.getElementById('LOGO'), VF=document.getElementById('VF');
const W=1080,H=1920;
/* ── colors and font come from project.config.json — never write a hardcoded color here ── */
let BG='#F3EFEA',INK='#1F1F1D',ACC='#D97757',CLAY='#BD5D3A',MUT='#8A847A',FONT='Cairo',HANDLE='@handle';
let FACE_ANCH=0.30;   /* where the speaker's face sits inside the video card: 0 = top · 1 = bottom (project.config.json ← crop.faceAnchor) */
let GRID=true;        /* faint background grid (project.config.json ← theme.grid:false turns it off) */
let BADGE_UNTIL=0;    /* ⛔ account badge is off (user-approved decision): the name is shown on the
                         platform itself and on the end card, and the top of the screen is space for graphics. Set BADGE_UNTIL directly in this file to bring it back for N seconds. */
let CAPS=[],VEND=0,OUTRO=0,DUR=0;
function init(d){
  CAPS=d.cards;VEND=d.total;OUTRO=d.outro;DUR=VEND+OUTRO;
  BEHIND=d.behind||null;
  const t=d.theme||{};
  BG=t.bg||BG; INK=t.ink||INK; ACC=t.acc||ACC; CLAY=t.clay||CLAY; MUT=t.mut||MUT;
  FONT=t.font||FONT; HANDLE=t.handle||HANDLE;
  if(typeof t.faceAnchor==='number') FACE_ANCH=t.faceAnchor;
  if(typeof t.badgeUntil==='number') BADGE_UNTIL=t.badgeUntil;
  if(typeof t.badge==='boolean') BADGE_UNTIL=t.badge?3:0;   /* back-compat: projects that wrote badge:false */
  if(typeof t.grid==='boolean') GRID=t.grid;
  if(d.transitions){ TX=Object.assign({},TX,d.transitions); TR=TX.sceneToScene.duration; }
  if(d.motifs){ for(const n in d.motifs){ const m={exports:{}};
    /* trusted skill file (scripts/motifs/canvas/<n>.js), read + injected by render_frames.js */
    new Function('module','exports',d.motifs[n])(m,m.exports); MOTIFS[n]=m.exports; } }
  if(d.schedule){ SCENES=d.schedule.map(e=>({s:e.s,e:e.e,m:MODES[e.m]||R_FULL,transition:e.transition,gb:e.gb})); _RES=false; }
  if(d.scenes) SCENELIST=d.scenes;
  if(t.logo){const L=document.getElementById('LOGO'); if(L.getAttribute('src')!==t.logo) L.src=t.logo;}
  if(FONT!=='Cairo'){const l=document.createElement('link');l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(FONT)+':wght@400;600;700;800;900&display=swap';
    document.head.appendChild(l);}
  return preloadBroll();   /* returns a Promise — the engine waits for the B-roll shots to load (if any) */
}
/* ---------- utils ---------- */
/* colors derived from the theme — never write a hardcoded rgba */
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgba(hex,a){const c=hx(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lum(hex){const c=hx(hex).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}
const cBG=a=>rgba(BG,a), cINK=a=>rgba(INK,a);
const onACC=()=>lum(ACC)>0.45?INK:'#FFFFFF';
const DARK=()=>lum(BG)<0.4;

const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{const c=1.9,s=c+1;return 1+s*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const pr=(t,a,b)=>cl((t-a)/(b-a),0,1);
/* ---------- transition vocabulary (scripts/transitions.json, injected via init) ---------- */
/* The four named easings. `linear` is the identity; the others reuse the fns above.
   `back` is out-back(1.9) — matches transitions.json's {overshoot:1.9}. */
const EZ={linear:t=>t,ease:ease,eio:eio,back:back};
const ez=n=>EZ[n]||eio;
/* Fallback = today's exact hand-tuned values, so studio.html (no injection) is unchanged.
   render_frames.js overwrites this from scripts/transitions.json in init(). */
let TX={ sceneToScene:{type:'rect-morph',duration:0.42,easing:'eio'},
         sceneEnter:{type:'rise',duration:0.20,easing:'ease',  params:{y:28, scale:true}},
         sceneExit: {type:'rise',duration:0.13,easing:'linear',params:{y:-10,scale:false}} };
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function sh(b,y,a){X.shadowColor=cINK(a);X.shadowBlur=b;X.shadowOffsetY=y;}
function nsh(){X.shadowColor='transparent';X.shadowBlur=0;X.shadowOffsetY=0;}
function card(x,y,w,h,r,al){X.save();X.globalAlpha*=(al===undefined?1:al);sh(44,18,0.20);X.fillStyle=cBG(0.97);rr(x,y,w,h,r);X.fill();nsh();X.strokeStyle=cINK(0.09);X.lineWidth=2.5;rr(x,y,w,h,r);X.stroke();X.restore();}
function T(s,x,y,f,c,al,dir){X.save();X.font=f;X.fillStyle=c;X.textAlign=al||'center';X.textBaseline='middle';if(dir)X.direction=dir;X.fillText(s,x,y);X.restore();}
/* ---------- video staging ---------- */
const R_FULL={x:0,y:0,w:1080,h:1920,r:0};
const R_STAGE={x:190,y:470,w:700,h:620,r:44};
const R_SIDE={x:120,y:480,w:840,h:560,r:44};
/* Video below, explanation above — for moments with a lot of information. Deliberately
   enters the Instagram belt: there's no text down there anyway, and what's covered is
   part of the image, not the speech. The speaker's head gets cropped a little from the top. */
const R_LOWER={x:350,y:1370,w:380,h:520,r:32};   /* small card at the bottom — for B-roll and big panels */
/* ⛔ The default for any moment with a graphic (user-approved): graphic on top (y 280-520)
   ← caption directly below it ← speaker's face below, full 9:16 card with no cropping. The
   viewer's eye travels in one line top to bottom. Don't use R_STAGE/R_SIDE (video in the
   middle + graphic above the head + caption below = three focus points, the viewer gets
   lost). R_STAGE/R_SIDE remain only for back-compat. */
const R_DOWN={x:214,y:760,w:652,h:1160,r:40};
let SCENES=[
 {s:0.00,e:3.32,m:R_FULL},{s:3.32,e:8.00,m:R_DOWN},{s:8.00,e:11.45,m:R_FULL},
 {s:11.45,e:15.36,m:R_DOWN},{s:15.36,e:18.56,m:R_DOWN},{s:18.56,e:20.42,m:R_FULL},
 {s:20.42,e:25.76,m:R_FULL},{s:25.76,e:28.35,m:R_DOWN},{s:28.35,e:30.75,m:R_FULL},
 {s:30.75,e:34.90,m:R_DOWN},{s:34.90,e:38.38,m:R_DOWN},{s:38.38,e:39.76,m:R_FULL},
 {s:39.76,e:42.82,m:R_DOWN},{s:42.82,e:99,m:R_FULL}];
/* scenes-as-data (issue #17): when render_frames.js injects a resolved config/scenes.json,
   SCENES is rebuilt from d.schedule and SCENELIST/MOTIFS drive drawScenes(t). No file →
   all null → the inline SCENES + the hardcoded scene functions run exactly as before. */
const MODES={FULL:R_FULL,DOWN:R_DOWN,LOWER:R_LOWER};
let SCENELIST=null, MOTIFS={};
let TR=0.42;   /* = TX.sceneToScene.duration; init() syncs it. panelIn() still reads it. */
/* The flexible card: shrinks proportionally (9:16) based on the graphic's bottom (gb) and
   the caption's line count at that moment — so nothing crowds anything else */
const CAPH=l=>l*LH+PADY*2;
function rDown(gb,lines){const top=gb+40+CAPH(lines)+50;return {x:0,y:top,w:1080,h:1920-top,r:0};}
let _RES=false;
function resolveScenes(){ if(_RES||!CAPS.length)return; _RES=true;
  SCENES.forEach(s=>{ if(s.m!==R_DOWN)return; const gb=s.gb||500; let lines=1;
    CAPS.forEach(c=>{ if(c.e>s.s&&c.s<s.e) lines=Math.max(lines,layout(c.w).length); });
    s.m=rDown(gb,lines); }); }
const isFull=R=>R.w>=1079&&R.h>=1919;   /* genuinely full-screen — don't rely on r (corner radius) */
function vtarget(t){ resolveScenes(); let i=SCENES.findIndex(s=>t>=s.s&&t<s.e); if(i<0)i=SCENES.length-1; return SCENES[i].m; }
/* The transition INTO SCENES[i]. `SCENES[i].transition` (object form) overrides type /
   duration / easing for that one boundary; otherwise TX.sceneToScene (rect-morph 0.42 eio).
   On the reel video only rect-morph / cut / dissolve are meaningful — it's one continuous
   take, so wipe/push (which read as two different shots) live in montage (#14) and the
   scene graphic layer (Pass 4). */
function vtrans(i){
  const d=TX.sceneToScene, o=(SCENES[i]&&SCENES[i].transition)||null;
  if(o&&typeof o==='object') return {type:o.type||d.type, dur:(o.duration!=null?o.duration:d.duration), easing:o.easing||d.easing};
  if(typeof o==='string')    return {type:o, dur:d.duration, easing:d.easing};
  return {type:d.type, dur:d.duration, easing:d.easing};
}
function vrect(t){
  resolveScenes();
  let i=SCENES.findIndex(s=>t>=s.s&&t<s.e); if(i<0)i=SCENES.length-1;
  const tr=vtrans(i);
  let a=SCENES[i].m,b=a,k=1;
  if(i>0&&tr.type!=='cut'&&t<SCENES[i].s+tr.dur){a=SCENES[i-1].m;b=SCENES[i].m;k=ez(tr.easing)(pr(t,SCENES[i].s,SCENES[i].s+tr.dur));}
  return {x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),w:lerp(a.w,b.w,k),h:lerp(a.h,b.h,k),r:lerp(a.r,b.r,k)};
}
/* Paint the source frame cropped into rect R. alpha=null → no globalAlpha touch (the
   steady-state path, byte-identical to before); a number → used for the dissolve blend. */
function paintVideo(R,alpha){
  const sw=VF.naturalWidth||1080, shh=VF.naturalHeight||1920;
  const sc=Math.max(R.w/sw,R.h/shh), cw=R.w/sc, ch=R.h/sc;
  const sx=(sw-cw)/2, sy=(shh-ch)*FACE_ANCH;
  X.save(); if(alpha!=null)X.globalAlpha*=alpha;
  if(R.r>0.5){sh(70,26,0.26);X.fillStyle='#000';rr(R.x,R.y,R.w,R.h,R.r);X.fill();nsh();}
  rr(R.x,R.y,R.w,R.h,R.r);X.clip();
  X.drawImage(VF,sx,sy,cw,ch,R.x,R.y,R.w,R.h);
  X.restore();
  if(R.r>0.5){X.save();if(alpha!=null)X.globalAlpha*=alpha;X.strokeStyle=cINK(0.10);X.lineWidth=3;rr(R.x,R.y,R.w,R.h,R.r);X.stroke();X.restore();}
}
function drawVideo(t){
  resolveScenes();
  let i=SCENES.findIndex(s=>t>=s.s&&t<s.e); if(i<0)i=SCENES.length-1;
  const tr=vtrans(i);
  if(i>0&&tr.type==='dissolve'&&t<SCENES[i].s+tr.dur){
    const k=ez(tr.easing)(pr(t,SCENES[i].s,SCENES[i].s+tr.dur));
    paintVideo(SCENES[i-1].m,1-k); paintVideo(SCENES[i].m,k); return;
  }
  paintVideo(vrect(t),null);   /* rect-morph (lerp) · cut (snapped) · steady state */
}
/* ---------- icons ---------- */
function iCaption(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.09;X.lineCap='round';
  rr(x-s/2,y-s*0.38,s,s*0.76,s*0.18);X.stroke();
  X.beginPath();X.moveTo(x-s*0.28,y-s*0.06);X.lineTo(x+s*0.28,y-s*0.06);X.moveTo(x-s*0.28,y+s*0.14);X.lineTo(x+s*0.06,y+s*0.14);X.stroke();X.restore();}
function iZoom(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.09;X.lineCap='round';
  X.beginPath();X.arc(x-s*0.06,y-s*0.06,s*0.3,0,7);X.stroke();
  X.beginPath();X.moveTo(x+s*0.16,y+s*0.16);X.lineTo(x+s*0.36,y+s*0.36);X.stroke();
  X.beginPath();X.moveTo(x-s*0.2,y-s*0.06);X.lineTo(x+s*0.08,y-s*0.06);X.moveTo(x-s*0.06,y-s*0.2);X.lineTo(x-s*0.06,y+s*0.08);X.stroke();X.restore();}
function iCut(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.085;X.lineCap='round';
  X.beginPath();X.arc(x-s*0.2,y+s*0.26,s*0.12,0,7);X.arc(x+s*0.2,y+s*0.26,s*0.12,0,7);X.stroke();
  X.beginPath();X.moveTo(x-s*0.24,y+s*0.16);X.lineTo(x+s*0.22,y-s*0.34);X.moveTo(x+s*0.24,y+s*0.16);X.lineTo(x-s*0.22,y-s*0.34);X.stroke();X.restore();}
function iSpark(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.10;X.lineCap='round';
  for(let i=0;i<8;i++){const a=i*Math.PI/4,r0=s*0.10,r1=s*(i%2?0.28:0.40);
    X.beginPath();X.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);X.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);X.stroke();}
  X.fillStyle=c;X.beginPath();X.arc(x,y,s*0.09,0,7);X.fill();X.restore();}
function iFile(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.085;X.lineJoin='round';
  X.beginPath();X.moveTo(x-s*0.28,y-s*0.4);X.lineTo(x+s*0.1,y-s*0.4);X.lineTo(x+s*0.28,y-s*0.2);X.lineTo(x+s*0.28,y+s*0.4);X.lineTo(x-s*0.28,y+s*0.4);X.closePath();X.stroke();
  X.beginPath();X.moveTo(x+s*0.1,y-s*0.4);X.lineTo(x+s*0.1,y-s*0.2);X.lineTo(x+s*0.28,y-s*0.2);X.stroke();X.restore();}
function iCloud(x,y,s,c){X.save();X.fillStyle=c;
  X.beginPath();X.arc(x-0.23*s,y+0.03*s,0.20*s,0,7);X.fill();
  X.beginPath();X.arc(x+0.02*s,y-0.11*s,0.28*s,0,7);X.fill();
  X.beginPath();X.arc(x+0.27*s,y+0.05*s,0.17*s,0,7);X.fill();
  rr(x-0.43*s,y+0.03*s,0.87*s,0.20*s,0.10*s);X.fill();X.restore();}
function iCheck(x,y,s,c,k){X.save();X.strokeStyle=c;X.lineWidth=s*0.13;X.lineCap='round';X.lineJoin='round';
  const p=[[-0.32,0.02],[-0.08,0.26],[0.34,-0.26]];X.beginPath();X.moveTo(x+p[0][0]*s,y+p[0][1]*s);
  if(k<0.5){const q=k/0.5;X.lineTo(x+lerp(p[0][0],p[1][0],q)*s,y+lerp(p[0][1],p[1][1],q)*s);}
  else{X.lineTo(x+p[1][0]*s,y+p[1][1]*s);const q=(k-0.5)/0.5;X.lineTo(x+lerp(p[1][0],p[2][0],q)*s,y+lerp(p[1][1],p[2][1],q)*s);}
  X.stroke();X.restore();}
/* ---------- persistent chrome ---------- */
/* A light grid in the background: gives depth and prevents dead space, and is
   light enough not to pull focus away from the drawing. Drawn before the video
   so the part underneath doesn't show. */
function grid(){ if(!GRID) return; X.save();
  X.strokeStyle=cINK(0.075); X.lineWidth=1.5;
  for(let x=60;x<W;x+=60){X.beginPath();X.moveTo(x+0.5,0);X.lineTo(x+0.5,H);X.stroke();}
  for(let y=60;y<H;y+=60){X.beginPath();X.moveTo(0,y+0.5);X.lineTo(W,y+0.5);X.stroke();}
  X.restore();}
function badge(t){
  /* Badge only at the start of the video, then disappears: the name is already
     written on the platform itself and on the end card, and keeping it up the
     whole video eats into the top of the screen that R_DOWN's drawing needs.
     theme.json ← badgeUntil (seconds) · 0 = disappears immediately · -1 = stays the whole video */
  if(!BADGE_UNTIL) return;                       /* 0 = permanently off */
  let a=pr(t,0.25,0.7);
  if(BADGE_UNTIL>0) a*=1-pr(t,BADGE_UNTIL,BADGE_UNTIL+0.4);
  if(t>VEND-0.3)a*=1-pr(t,VEND-0.3,VEND);
  if(a<=0)return; X.save();X.globalAlpha=a;
  X.font='700 30px '+FONT;const s=HANDLE;
  const tw=X.measureText(s).width,lw=42,g=15,p=30,w=lw+g+tw+p*2,h=76,x=540-w/2,y=190;   /* 190 not 74: the very top of the screen is covered by Instagram's UI */
  sh(26,10,0.16);X.fillStyle=cBG(0.94);rr(x,y,w,h,h/2);X.fill();nsh();
  X.strokeStyle=cINK(0.08);X.lineWidth=2;rr(x,y,w,h,h/2);X.stroke();
  X.drawImage(LOGO,x+w-p-lw,y+(h-lw)/2,lw,lw);
  X.fillStyle=INK;X.direction='ltr';X.textAlign='right';X.textBaseline='middle';X.fillText(s,x+w-p-lw-g,y+h/2+2);
  X.restore();}
function bar(t){let a=t>VEND-0.3?1-pr(t,VEND-0.3,VEND):1;if(a<=0)return;
  if(cutoutActive(t)||headoutActive(t))return;     /* In the cutout modes the bar clutters things — hide it */
  const _rb=vtarget(t), _lowb=_rb.y>700;            /* In "video-below" mode the bar rises above it */
  X.save();X.globalAlpha=a;const y=_lowb?Math.max(200,_rb.y-30):1492,h=7,mx=60;
  X.fillStyle=cINK(0.13);rr(mx,y,W-mx*2,h,h/2);X.fill();
  X.fillStyle=ACC;rr(mx,y,(W-mx*2)*cl(t/VEND,0,1),h,h/2);X.fill();X.restore();}
/* ---------- captions ---------- */
const FS=55,LH=79,MAXW=730,GAP=16,PADX=44,PADY=30;  /* 730: keeps the card ending before Instagram's button column */
function layout(ws){X.font='800 '+FS+'px '+FONT;
  const it=ws.map(w=>({...w,w:X.measureText(w.t).width}));const L=[];let c=[],cw=0;
  for(const i of it){const add=c.length?i.w+GAP:i.w;
    if(cw+add>MAXW&&c.length){L.push({items:c,w:cw});c=[i];cw=i.w;}else{c.push(i);cw+=add;}}
  if(c.length)L.push({items:c,w:cw});return L;}
function caption(t){
  /* Don't duplicate: if the speech passes behind the person at this moment, the caption card disappears */
  if(BEHIND&&PRS_OK&&isFull(vrect(t))&&BEHIND.lines.some(l=>t>=l.s&&t<=l.e)) return;
  const c=CAPS.find(c=>t>=c.s&&t<c.e); if(!c)return;
  const lt=t-c.s,rt=c.e-t;let a=1,dy=0,sc=1;
  const _en=TX.sceneEnter,_ex=TX.sceneExit;   /* `rise` — the caption default (== today's values) */
  if(lt<_en.duration){const k=lt/_en.duration,e=ez(_en.easing)(k);a=e;dy=(1-e)*_en.params.y;sc=_en.params.scale?0.93+0.07*back(k):1;}
  if(rt<_ex.duration){const k=rt/_ex.duration,e=ez(_ex.easing)(k);a=e;dy=(1-e)*_ex.params.y;}
  const L=layout(c.w),bh=L.length*LH+PADY*2,bw=Math.max(...L.map(l=>l.w))+PADX*2;
  const _R=vtarget(t), LOW=_R.y>700;   /* Target rect, not the moving one: the caption locks into place from the first frame with no jump */          /* R_DOWN or R_LOWER → caption above the video card */          /* Video below → caption above it */
  const CUT=(cutoutActive(t)||headoutActive(t))&&PTOP>200;   /* Caption above their head in both modes */
  const SEAM=isFull(_R)?0:Math.round(bh*0.42);   /* Caption riding on the video's edge */
  const bx=540-bw/2,by=(CUT?PTOP-46:(LOW?_R.y-60+SEAM:1460))-bh;   /* 1460 normally · on the video's edge in "video-below" mode */
  X.save();X.globalAlpha=a;X.translate(540,by+bh/2+dy);X.scale(sc,sc);X.translate(-540,-(by+bh/2));
  sh(48,20,0.30);X.fillStyle=cBG(0.96);rr(bx,by,bw,bh,38);X.fill();nsh();
  X.strokeStyle=cINK(0.09);X.lineWidth=2.5;rr(bx,by,bw,bh,38);X.stroke();
  X.font='800 '+FS+'px '+FONT;X.textAlign='right';X.textBaseline='middle';
  L.forEach((ln,li)=>{let x=540+ln.w/2;const cy=by+PADY+LH*li+LH/2;
    for(const i of ln.items){const act=t>=i.s&&t<i.e,sp=t>=i.s;let lift=0;
