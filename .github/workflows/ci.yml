name: ci

# One job, kept under ~2 min. Fast static checks, then the headless suite in
# video-editor/test/ (web UI + lint_compose + behind_text + the ffmpeg resolver + the
# motifs). The suite needs ffmpeg (installed + cached below — ubuntu-latest has none),
# Chromium (cached), and the system python3 — no `uv sync` (the tested scripts are
# stdlib + lib/).

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: video-editor/.nvmrc

      - uses: actions/setup-python@v7
        with:
          python-version-file: video-editor/.python-version

      - name: cache node_modules (incl. Puppeteer's Chromium under .cache/)
        id: nm
        uses: actions/cache@v6
        with:
          path: video-editor/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('video-editor/package-lock.json') }}

      # --- fast static checks ---
      - name: node --check every .js / .cjs / .mjs
        run: find video-editor/scripts video-editor/test \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: python -m compileall on every .py
        run: python -m compileall -q video-editor/scripts
      - name: bash -n every .sh
        run: find video-editor/scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: every .json under video-editor/ parses
        run: find video-editor -name '*.json' -not -path '*/node_modules/*' -print0 | xargs -0 -r -n1 python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8-sig'))"
      - name: Remotion template — package-lock.json installs cleanly (#45)
        run: cd video-editor/scripts/remotion/template && npm ci --silent --ignore-scripts

      # --- the headless suite ---
      # ffmpeg: cache the static binaries so a bad download can't redden CI. The cache
      # hits on ~every run (zero network). On a cold cache we pull BtbN's static build
      # from GitHub Releases — reachable whenever Actions itself is (johnvansickle.com,
      # which setup-ffmpeg used, is not) — retrying five times, then apt as a last
      # resort. Bump the key's vN to pull a newer ffmpeg.
      - name: cache ffmpeg
        uses: actions/cache@v6
        with:
          path: ~/.local/ffmpeg
          key: ffmpeg-btbn-${{ runner.os }}-v1
      - name: ffmpeg
        run: |
          set -eu
          DEST="$HOME/.local/ffmpeg"
          if [ ! -x "$DEST/ffmpeg" ]; then
            mkdir -p "$DEST"
            D=ffmpeg-master-latest-linux64-gpl
            URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$D.tar.xz"
            ok=
            for n in 1 2 3 4 5; do
              if curl -fL --connect-timeout 30 --max-time 600 -o /tmp/ffmpeg.tar.xz "$URL" \
                 && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp "$D/bin/ffmpeg" "$D/bin/ffprobe"; then
                mv "/tmp/$D/bin/ffmpeg" "/tmp/$D/bin/ffprobe" "$DEST/"
                ok=1; break
              fi
              echo "ffmpeg fetch $n/5 failed; retrying in 10s"; sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::warning::ffmpeg download failed 5x — falling back to apt"
              sudo apt-get update && sudo apt-get install -y ffmpeg
              rmdir "$DEST" 2>/dev/null || true
              DEST="$(dirname "$(command -v ffmpeg)")"
            fi
          fi
          printf '%s\n' "$DEST" >> "$GITHUB_PATH"
          "$DEST/ffmpeg" -version | head -n1 || true
      - name: node deps + bundled Chromium (skipped on a cache hit)
        if: steps.nm.outputs.cache-hit != 'true'
        working-directory: video-editor
        run: npm ci --silent
      - name: headless suite
        working-directory: video-editor
        run: xvfb-run -a node test/run.mjs

