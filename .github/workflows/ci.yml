name: ci

# One job, kept well under 2 min. Fast static checks, the timeline projection unit tests, and the
# type-check of the Remotion template — nothing here needs ffmpeg, a browser or a GPU, because a
# video cannot be tested by a machine: what proves it is a real render, looked at.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: video-editor/.nvmrc

      - uses: actions/setup-python@v7
        with:
          python-version-file: video-editor/.python-version

      # --- fast static checks ---
      - name: python -m compileall on every .py
        run: python -m compileall -q video-editor/scripts
      # lib/timeline.py projects source time onto output time — every caption, sound cue
      # and rendered segment gets its position from it (#144). Stdlib only, no ffmpeg.
      - name: timeline projection unit tests
        working-directory: video-editor
        run: python -m unittest discover test
      - name: bash -n every .sh
        run: find video-editor/scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: every .json under video-editor/ parses
        run: find video-editor -name '*.json' -not -path '*/node_modules/*' -print0 | xargs -0 -r -n1 python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8-sig'))"
      - name: Remotion template — package-lock.json installs cleanly (#45)
        run: cd video-editor/scripts/remotion/template && npm ci --silent --ignore-scripts

      # The type-checker is the linter for everything that draws: layouts, transitions, scenes and
      # filters are TypeScript, so tsc catches undefined helpers, bad props, a misspelt parameter,
      # and a scene keyword with no component (or the reverse). It needs the one data file
      # remotion.sh generates into <work>/remotion/ — seed the sample (#144).
      - name: Remotion template type-check (tsc --noEmit)
        run: |
          cd video-editor/scripts/remotion/template
          cp src/plan.sample.json src/plan.json
          npm run --silent check
